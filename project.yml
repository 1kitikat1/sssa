name: NemesisAI
options:
  bundleIdPrefix: com.nemesis
  deploymentTarget:
    iOS: 15.0
targets:
  NemesisAI:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yaml"
          - "Podfile"
          - "codemagic.yaml"
          - "*.md"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nemesis.ai
        CODE_SIGN_STYLE: Automatic
