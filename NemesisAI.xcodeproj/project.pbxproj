workflows:
  ios-native:
    name: iOS Native Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Pods
        script: |
          pod install

      - name: Build IPA
        script: |
          set -e
          
          # Проверяем файлы
          echo "📁 Checking project files..."
          ls -la
          ls -la NemesisAI.xcodeproj/

          # Находим workspace
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ Workspace not found!"
            exit 1
          fi
          
          echo "📦 Using workspace: $WORKSPACE"

          # Сборка
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

          # Ищем .app
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found!"
            exit 1
          fi

          echo "✅ App found: $APP_PATH"

          # Создаём IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/
          
          mkdir -p build/ios
          mv NemesisAI.ipa build/ios/
          
          echo "✅ Build complete!"
    artifacts:
      - build/ios/NemesisAI.ipa
