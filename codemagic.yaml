workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - node_modules
        - ios/Pods
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Expo modules used by App.tsx
        script: |
          npx expo install expo-clipboard expo-linear-gradient react-native-webview

      - name: Prebuild
        script: |
          npx expo prebuild --platform ios --clean

      - name: Show available schemes (debug aid — check this if the build step fails)
        script: |
          cd ios
          xcodebuild -list -workspace *.xcworkspace || xcodebuild -list -project *.xcodeproj

      - name: Install Pods
        script: |
          cd ios && pod install && cd ..

      - name: Build IPA (unsigned)
        script: |
          set -e
          cd ios

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app bundle not found after build"
            exit 1
          fi
          echo "✅ App found: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/

          mkdir -p ../build/ios
          mv NemesisAI.ipa ../build/ios/
          rm -rf Payload
          cd ..
    artifacts:
      - build/ios/NemesisAI.ipa
