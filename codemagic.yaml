name: Nemesis AI Build
workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      ios_signing:
        distribution_type: development

      "bundleIdentifier": "com.kitikat.nemesisai" // или другой
        apple_id: grigorijv624@gmail.com
        automatic_code_signing: true
      vars:
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install Expo CLI
        script: |
          npm install -g expo-cli eas-cli
      - name: Build with EAS (local)
        script: |
          eas build --platform ios --profile preview --non-interactive --local
    artifacts:
      - /build/**/*.ipa
      - build-ios/**/*.ipa
      - ios/build/**/*.ipa
      - /Users/builder/clone/**/*.ipa
