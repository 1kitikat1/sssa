workflows:
  ios-native-workflow:
    name: iOS Native Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ios/Pods
    scripts:
      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..

      - name: Build IPA (unsigned)
        script: |
          set -e
          cd ios

          # Определяем workspace и scheme
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME="NemesisAI"
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"

          # Сборка
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

          # Поиск .app
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app bundle not found"
            exit 1
          fi
          
          echo "✅ App found: $APP_PATH"

          # Создание IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/
          rm -rf Payload
          
          mkdir -p ../build/ios
          mv NemesisAI.ipa ../build/ios/
          
          cd ..
    artifacts:
      - build/ios/NemesisAI.ipa
