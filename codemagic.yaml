name: Nemesis AI Build
workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      vars:
        NODE_VERSION: 18
        APPLE_ID: grigorijv624@gmail.com
      ios_signing:
        distribution_type: development
        bundle_identifier: com.kitikat.nemesisai
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build iOS
        script: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          xcodebuild \
            -workspace NemesisAI.xcworkspace \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build
          
          # Найди .app
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          echo "✅ App found: $APP_PATH"
          
          # Создай IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/
          mv NemesisAI.ipa ../build/ios/
          rm -rf Payload
          cd ..
    artifacts:
      - build/ios/NemesisAI.ipa
      - ios/NemesisAI.ipa
      - NemesisAI.ipa
