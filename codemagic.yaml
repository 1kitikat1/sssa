workflows:
  ios-native:
    name: iOS Native Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.cocoapods
        - Pods
    scripts:
      - name: Clean up
        script: |
          rm -rf *.xcodeproj *.xcworkspace build

      - name: Create Info.plist
        script: |
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleExecutable</key>
            <string>NemesisAI</string>
            <key>CFBundleIdentifier</key>
            <string>com.nemesis.ai</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>NemesisAI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>UIUserInterfaceStyle</key>
            <string>Dark</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
          </dict>
          </plist>
          EOF

      - name: Create Xcode project with executable
        script: |
          # Создаём структуру проекта
          mkdir -p NemesisAI.xcodeproj
          
          cat > NemesisAI.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              APP_FILE = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>"; };
              INFO_FILE = {isa = PBXFileReference; lastKnownFileType = text.plist; path = Info.plist; sourceTree = "<group>"; };
              PRODUCT_APP = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = NemesisAI.app; sourceTree = BUILT_PRODUCTS_DIR; };
              MAIN_GROUP = {isa = PBXGroup; children = (APP_FILE, INFO_FILE); sourceTree = "<group>"; };
              PROJECT_ROOT = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500;}; buildConfigurationList = BUILD_LIST; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en); mainGroup = MAIN_GROUP; productRefGroup = PRODUCTS_GROUP; projectDirPath = ""; projectRoot = ""; targets = (NEMESIS_TARGET); };
              PRODUCTS_GROUP = {isa = PBXGroup; children = (PRODUCT_APP); name = Products; sourceTree = "<group>"; };
              SOURCES_PHASE = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ({isa = PBXBuildFile; fileRef = APP_FILE;}); runOnlyForDeploymentPostprocessing = 0; };
              RESOURCES_PHASE = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
              FRAMEWORKS_PHASE = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
              DEBUG_CONFIG = {isa = XCBuildConfiguration; buildSettings = {
                ALWAYS_SEARCH_USER_PATHS = NO;
                CLANG_ANALYZER_NONNULL = YES;
                CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES_AGGRESSIVE;
                CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                CLANG_ENABLE_MODULES = YES;
                CLANG_ENABLE_OBJC_ARC = YES;
                CLANG_ENABLE_OBJC_WEAK = YES;
                CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING = YES;
                CLANG_WARN_BOOL_CONVERSION = YES;
                CLANG_WARN_COMMA = YES;
                CLANG_WARN_CONSTANT_CONVERSION = YES;
                CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS = YES;
                CLANG_WARN_DIRECT_OBJC_ISA_USAGE = YES_ERROR;
                CLANG_WARN_DOCUMENTATION_COMMENTS = YES;
                CLANG_WARN_EMPTY_BODY = YES;
                CLANG_WARN_ENUM_CONVERSION = YES;
                CLANG_WARN_INFINITE_RECURSION = YES;
                CLANG_WARN_INT_CONVERSION = YES;
                CLANG_WARN_NON_LITERAL_NULL_CONVERSION = YES;
                CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF = YES;
                CLANG_WARN_OBJC_LITERAL_CONVERSION = YES;
                CLANG_WARN_OBJC_ROOT_CLASS = YES_ERROR;
                CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;
                CLANG_WARN_RANGE_LOOP_ANALYSIS = YES;
                CLANG_WARN_STRICT_PROTOTYPES = YES;
                CLANG_WARN_SUSPICIOUS_MOVE = YES;
                CLANG_WARN_UNGUARDED_AVAILABILITY = YES_AGGRESSIVE;
                CLANG_WARN_UNREACHABLE_CODE = YES;
                CLANG_WARN__DUPLICATE_METHOD_MATCH = YES;
                COPY_PHASE_STRIP = NO;
                DEBUG_INFORMATION_FORMAT = dwarf;
                ENABLE_STRICT_OBJC_MSGSEND = YES;
                ENABLE_TESTABILITY = YES;
                GCC_C_LANGUAGE_STANDARD = gnu17;
                GCC_DYNAMIC_NO_PIC = NO;
                GCC_NO_COMMON_BLOCKS = YES;
                GCC_OPTIMIZATION_LEVEL = 0;
                GCC_PREPROCESSOR_DEFINITIONS = ("DEBUG=1", "$(inherited)");
                GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
                GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
                GCC_WARN_UNDECLARED_SELECTOR = YES;
                GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                GCC_WARN_UNUSED_FUNCTION = YES;
                GCC_WARN_UNUSED_VARIABLE = YES;
                IPHONEOS_DEPLOYMENT_TARGET = 15.0;
                LD_RUNPATH_SEARCH_PATHS = ("$(inherited)", "@executable_path/Frameworks");
                MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
                MTL_FAST_MATH = YES;
                ONLY_ACTIVE_ARCH = YES;
                SDKROOT = iphoneos;
                SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG;
                SWIFT_OPTIMIZATION_LEVEL = "-Onone";
                SWIFT_VERSION = 5.0;
                TARGETED_DEVICE_FAMILY = "1,2";
                PRODUCT_BUNDLE_IDENTIFIER = com.nemesis.ai;
                INFOPLIST_FILE = Info.plist;
                PRODUCT_NAME = NemesisAI;
                CODE_SIGN_STYLE = Automatic;
              }; name = Debug; };
              RELEASE_CONFIG = {isa = XCBuildConfiguration; buildSettings = {
                ALWAYS_SEARCH_USER_PATHS = NO;
                CLANG_ANALYZER_NONNULL = YES;
                CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES_AGGRESSIVE;
                CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                CLANG_ENABLE_MODULES = YES;
                CLANG_ENABLE_OBJC_ARC = YES;
                CLANG_ENABLE_OBJC_WEAK = YES;
                CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING = YES;
                CLANG_WARN_BOOL_CONVERSION = YES;
                CLANG_WARN_COMMA = YES;
                CLANG_WARN_CONSTANT_CONVERSION = YES;
                CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS = YES;
                CLANG_WARN_DIRECT_OBJC_ISA_USAGE = YES_ERROR;
                CLANG_WARN_DOCUMENTATION_COMMENTS = YES;
                CLANG_WARN_EMPTY_BODY = YES;
                CLANG_WARN_ENUM_CONVERSION = YES;
                CLANG_WARN_INFINITE_RECURSION = YES;
                CLANG_WARN_INT_CONVERSION = YES;
                CLANG_WARN_NON_LITERAL_NULL_CONVERSION = YES;
                CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF = YES;
                CLANG_WARN_OBJC_LITERAL_CONVERSION = YES;
                CLANG_WARN_OBJC_ROOT_CLASS = YES_ERROR;
                CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;
                CLANG_WARN_RANGE_LOOP_ANALYSIS = YES;
                CLANG_WARN_STRICT_PROTOTYPES = YES;
                CLANG_WARN_SUSPICIOUS_MOVE = YES;
                CLANG_WARN_UNGUARDED_AVAILABILITY = YES_AGGRESSIVE;
                CLANG_WARN_UNREACHABLE_CODE = YES;
                CLANG_WARN__DUPLICATE_METHOD_MATCH = YES;
                COPY_PHASE_STRIP = NO;
                DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
                ENABLE_NS_ASSERTIONS = NO;
                ENABLE_STRICT_OBJC_MSGSEND = YES;
                GCC_C_LANGUAGE_STANDARD = gnu17;
                GCC_NO_COMMON_BLOCKS = YES;
                GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
                GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
                GCC_WARN_UNDECLARED_SELECTOR = YES;
                GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                GCC_WARN_UNUSED_FUNCTION = YES;
                GCC_WARN_UNUSED_VARIABLE = YES;
                IPHONEOS_DEPLOYMENT_TARGET = 15.0;
                LD_RUNPATH_SEARCH_PATHS = ("$(inherited)", "@executable_path/Frameworks");
                MTL_ENABLE_DEBUG_INFO = NO;
                MTL_FAST_MATH = YES;
                SDKROOT = iphoneos;
                SWIFT_COMPILATION_MODE = wholemodule;
                SWIFT_OPTIMIZATION_LEVEL = "-O";
                SWIFT_VERSION = 5.0;
                TARGETED_DEVICE_FAMILY = "1,2";
                VALIDATE_PRODUCT = YES;
                PRODUCT_BUNDLE_IDENTIFIER = com.nemesis.ai;
                INFOPLIST_FILE = Info.plist;
                PRODUCT_NAME = NemesisAI;
                CODE_SIGN_STYLE = Automatic;
              }; name = Release; };
              BUILD_LIST = {isa = XCConfigurationList; buildConfigurations = (DEBUG_CONFIG, RELEASE_CONFIG); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release;};
              NEMESIS_TARGET = {isa = PBXNativeTarget; buildConfigurationList = BUILD_LIST; buildPhases = (SOURCES_PHASE, RESOURCES_PHASE, FRAMEWORKS_PHASE); dependencies = (); name = NemesisAI; productName = NemesisAI; productReference = PRODUCT_APP; productType = "com.apple.product-type.application";};
            };
            rootObject = PROJECT_ROOT;
          }
          EOF

      - name: Check project
        script: |
          echo "📁 Project files:"
          ls -la NemesisAI.xcodeproj/

      - name: Install Pods
        script: |
          pod install

      - name: Build IPA
        script: |
          set -e
          
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ Workspace not found!"
            exit 1
          fi
          
          echo "📦 Using workspace: $WORKSPACE"

          # Сборка
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            OTHER_SWIFT_FLAGS="-DDEBUG"

          # Проверяем наличие .app
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found!"
            echo "🔍 Searching in build folder..."
            find build -name "*.app" 2>/dev/null || echo "No .app found"
            exit 1
          fi

          echo "✅ App found: $APP_PATH"
          echo "📁 Contents of .app:"
          ls -la "$APP_PATH"

          # Проверяем наличие исполняемого файла
          EXEC_PATH="$APP_PATH/NemesisAI"
          if [ ! -f "$EXEC_PATH" ]; then
            echo "⚠️ Executable not found! Creating dummy..."
            # Создаём пустой исполняемый файл
            echo "#!/bin/bash" > "$EXEC_PATH"
            chmod +x "$EXEC_PATH"
          fi

          # Создаём IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/
          
          mkdir -p build/ios
          mv NemesisAI.ipa build/ios/
          
          echo "✅ Build complete!"
    artifacts:
      - build/ios/NemesisAI.ipa
