name: Nemesis AI Build
workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      vars:
        NODE_VERSION: 18
        APPLE_ID: grigorijv624@gmail.com
        APPLE_TEAM_ID: ""
      ios_signing:
        distribution_type: development
        bundle_identifier: com.kitikat.nemesisai
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build with EAS
        script: |
          npx eas-cli build --platform ios --profile preview --non-interactive --local
    artifacts:
      - /build/**/*.ipa
      - build-ios/**/*.ipa
      - ios/build/**/*.ipa
