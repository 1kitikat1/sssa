name: Nemesis AI Build
workflows:
  ios-workflow:
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      vars:
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Build iOS
        script: |
          cd ios
          pod install
          xcodebuild \
            -workspace YourApp.xcworkspace \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -exportArchive \
            -archivePath build/Release-iphoneos/YourApp.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/ios/**/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
