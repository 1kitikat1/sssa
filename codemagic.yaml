name: Nemesis AI Build
workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build with EAS
        script: |
          npx eas-cli build --platform ios --profile preview --non-interactive --local
    artifacts:
      - /build/**/*.ipa
      - build-ios/**/*.ipa
      - ios/build/**/*.ipa
