name: Nemesis AI Build
workflows:
  ios-workflow:
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      ios_signing:
        distribution_type: development
      vars:
        BUNDLE_ID: com.Nemesis.AI
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build iOS
        script: |
          npx expo build:ios
    artifacts:
      - build/ios/ipa/*.ipa
