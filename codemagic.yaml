name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

workflows:
  ios-workflow:
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      vars:
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build iOS
        script: |
          npx expo export --platform ios
    artifacts:
      - build/ios/**/*.app
