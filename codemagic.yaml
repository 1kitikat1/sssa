workflows:
  ios-native:
    name: iOS Native Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.cocoapods
        - ios/Pods
    scripts:
      - name: Install Pods
        script: |
          pod install

      - name: Build IPA
        script: |
          set -e
          xcodebuild \
            -workspace NemesisAI.xcworkspace \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NemesisAI.ipa Payload/
          mkdir -p build/ios
          mv NemesisAI.ipa build/ios/
    artifacts:
      - build/ios/NemesisAI.ipa
