- name: Build iOS
  script: |
    cd ios
    pod install
    xcodebuild archive \
      -workspace NemesisAI.xcworkspace \
      -scheme NemesisAI \
      -configuration Release \
      -sdk iphoneos \
      -arch arm64 \
      CODE_SIGNING_ALLOWED=NO \
      -derivedDataPath build \
      -archivePath build/NemesisAI.xcarchive
    # Теперь архив точно будет в build/
    ARCHIVE_PATH="build/NemesisAI.xcarchive"
    echo "Archive path: $ARCHIVE_PATH"
    ls -la "$ARCHIVE_PATH"
    xcodebuild -exportArchive \
      -archivePath "$ARCHIVE_PATH" \
      -exportPath ../build/ios \
      -exportOptionsPlist exportOptions.plist
