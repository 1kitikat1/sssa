name: Nemesis AI Build
workflows:
  ios-workflow:
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      vars:
        NODE_VERSION: 18
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Build iOS
        script: |
          cd ios
          pod install
          xcodebuild \
            -workspace NemesisAI.xcworkspace \
            -scheme NemesisAI \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
          # Упакуй в IPA
          mkdir -p ../build/ios/Payload
          cp -r build/Release-iphoneos/NemesisAI.app ../build/ios/Payload/
          cd ../build/ios
          zip -r NemesisAI.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/*.ipa
